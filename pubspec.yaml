name: insyira_muslim_app
description: "A new Flutter project."
publish_to: 'none'
# ⚠️ Angka setelah tanda + adalah versionCode untuk Google Play. Play MENOLAK
# nilai yang sudah pernah diunggah, jadi WAJIB dinaikkan setiap kali mengunggah
# build baru (1.0.0+1 internal testing, +3 closed testing pertama).
# +4 (22 Sep 2026): perbaikan warna kolom isian Login/Daftar + diagnostik notifikasi adzan.
# +5 (22 Sep 2026): perbaikan suara adzan hilang di build rilis (resource shrinker
# menghapus res/raw/adzan.mp3 — lihat android/app/src/main/res/raw/keep.xml) +
# hitung mundur "Shalat Selanjutnya" tidak lagi macet di "Memuat..." setelah Isya.
# +6 (26 Sep 2026): adzan dibunyikan sendiri saat aplikasi sedang dibuka (alarm
# sistem sering diblokir penghemat baterai), JANGAN pakai cancelAll() di jalur
# penjadwalan adzan (menghapus pengingat dzikir), pengingat dzikir pagi 09:00 &
# sore 17:00, kartu Status Notifikasi di Pengaturan, dan kiblat versi web untuk
# peramban HP.
# +9 (5 Okt 2026): baris waktu sholat tidak lagi terpotong di layar sempit /
# huruf sistem besar (laporan tester Z Flip 4), kartu "Runtutan Harian" tidak
# lagi menyuruh dzikir di luar waktunya, pesan pengingat sore tidak lagi menagih
# dzikir pagi, dan "Mode Utara" supaya kiblat tetap bisa dibaca di PC (tanpa
# sensor kompas).
# +10 (5 Okt 2026): PEMBUATAN ULANG yang +9. AAB +9 dibangun TANPA
# `--dart-define=API_BASE_URL=...`, sehingga aplikasi menembak alamat LAN dev
# (http://192.168.18.4:8000/api) dan SELURUH data online (kajian, fawaidh,
# kajian online) kosong di HP tester. ⚠️ JANGAN pernah `flutter build appbundle`
# tanpa `--dart-define=API_BASE_URL=https://api.pusatoleolehpekanbaru.id/api`.
# +12 (29 Okt 2026): jadwal kajian diurutkan dari yang terbaru, Sira mengenali
# halaman Pengaturan/Tentang/pemutar video (dan tampil di pemutar video), serta
# fitur baru "Obrolan dengan Sira" yang menjawab pertanyaan soal aplikasi
# sesuai halaman yang sedang dibuka.
version: 1.0.0+12

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0  
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  adhan: ^2.0.0+1
  intl: ^0.20.3
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_compass: ^0.8.1
  scrollable_positioned_list: ^0.3.8
  camera: ^0.12.0+2
  permission_handler: ^11.3.1
  flutter_spinkit: ^5.2.2
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  url_launcher: ^6.3.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2
  go_router: ^17.5.0
  # Dipakai HANYA oleh implementasi kompas peramban
  # (`lib/services/web_compass_web.dart`) — fitur arah kiblat di web untuk HP.
  # `flutter_compass` tidak punya implementasi web, jadi sensor dibaca langsung
  # lewat API `deviceorientation`.
  web: ^1.1.1
  youtube_player_iframe: ^6.0.2
  share_plus: ^13.3.1
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audios/
    - assets/audios/dzikir/pagi/
    - assets/audios/dzikir/sore/
    - assets/fonts/
    - assets/fonts/QCF/
    - assets/dzikir.json

  fonts:
    - family: LPMQ
      fonts:
        - asset: assets/fonts/lpmq.ttf

# 👇 KONFIGURASI IKON APLIKASI (ditaruh di paling bawah, sejajar dengan "flutter:")
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo_insyira.png"
  min_sdk_android: 21
  # Untuk Android 8.0+ (Adaptive Icon - bentuk bulat/kotak otomatis)
  adaptive_icon_background: "#003527"     # Warna hijau tua Insyira
  adaptive_icon_foreground: "assets/images/logo_insyira.png"
  # Optional: hapus komentar di bawah kalau mau background gradien
  # adaptive_icon_background: "assets/images/background_gradient.png"
name: insyira_muslim_app
description: "A new Flutter project."
publish_to: 'none'
# ⚠️ Angka setelah tanda + adalah versionCode untuk Google Play. Play MENOLAK
# nilai yang sudah pernah diunggah, jadi WAJIB dinaikkan setiap kali mengunggah
# build baru (1.0.0+1 internal testing, +3 closed testing pertama).
# +4 (22 Sep 2026): perbaikan warna kolom isian Login/Daftar + diagnostik notifikasi adzan.
# +5 (22 Sep 2026): perbaikan suara adzan hilang di build rilis (resource shrinker
# menghapus res/raw/adzan.mp3 — lihat android/app/src/main/res/raw/keep.xml) +
# hitung mundur "Shalat Selanjutnya" tidak lagi macet di "Memuat..." setelah Isya.
version: 1.0.0+5

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0  
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  adhan: ^2.0.0+1
  intl: ^0.20.3
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_compass: ^0.8.1
  scrollable_positioned_list: ^0.3.8
  camera: ^0.12.0+2
  permission_handler: ^11.3.1
  flutter_spinkit: ^5.2.2
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  url_launcher: ^6.3.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2
  go_router: ^17.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audios/
    - assets/audios/dzikir/pagi/
    - assets/audios/dzikir/sore/
    - assets/data/
    - assets/fonts/
    - assets/fonts/QCF/
    - assets/dzikir.json

  fonts:
    - family: LPMQ
      fonts:
        - asset: assets/fonts/lpmq.ttf

# 👇 KONFIGURASI IKON APLIKASI (ditaruh di paling bawah, sejajar dengan "flutter:")
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo_insyira.png"
  min_sdk_android: 21
  # Untuk Android 8.0+ (Adaptive Icon - bentuk bulat/kotak otomatis)
  adaptive_icon_background: "#003527"     # Warna hijau tua Insyira
  adaptive_icon_foreground: "assets/images/logo_insyira.png"
  # Optional: hapus komentar di bawah kalau mau background gradien
  # adaptive_icon_background: "assets/images/background_gradient.png"